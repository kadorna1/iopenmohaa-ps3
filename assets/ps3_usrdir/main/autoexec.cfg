# PS3 controller aim assist startup config
#
# This file is packaged as:
#   /dev_hdd0/game/OMOHAA020/USRDIR/main/autoexec.cfg
#
# OpenMoHAA executes autoexec.cfg at startup after the user's omconfig.cfg.
# These PS3 settings deliberately override older archived renderer values so
# the compact texture and dynamic-light paths are active on all three titles.
seta r_texturebits "16"
seta r_fastdlights "1"

seta ps3_aim_assist "1"
seta ps3_aim_assist_strength "1.0"
