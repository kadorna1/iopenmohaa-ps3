name: PS3 / PSL1GHT Build

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:
    inputs:
      experimental_spu_audio:
        description: "Build the experimental SPU audio mixer (hardware testing required)"
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  PS3DEV_ARCHIVE_URL: https://github.com/ps3dev/ps3dev/releases/download/nightly-2026-10-12/ps3dev-linux-X64.tar.gz
  PS3DEV_ARCHIVE_SHA256: 76b1b3bc9ac260a4ece86da520225da7f2f4e334174e37b850093ff925eeb900
  OPENMOHAA_PS3_DATA_APPID: OMOHAA020

jobs:
  # The builder image is immutable per dependency-manifest/Dockerfile hash.
  # Normal runs reuse the existing GHCR image instead of reinstalling APT packages.
  prepare-builder:
    name: Prepare persistent PS3 host build environment
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve dependency image fingerprint
        id: image
        shell: bash
        run: |
          set -euo pipefail
          source_ref=HEAD
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"
            source_ref=FETCH_HEAD
          fi

          tmp="$(mktemp -d)"
          if [[ "$source_ref" == "HEAD" ]]; then
            cp .github/ps3-host-deps.txt "$tmp/ps3-host-deps.txt"
            cp .github/docker/ps3-builder.Dockerfile "$tmp/ps3-builder.Dockerfile"
          else
            git show "$source_ref:.github/ps3-host-deps.txt" > "$tmp/ps3-host-deps.txt"
            git show "$source_ref:.github/docker/ps3-builder.Dockerfile" > "$tmp/ps3-builder.Dockerfile"
          fi

          deps_sha="$(sha256sum "$tmp/ps3-host-deps.txt" | cut -d ' ' -f 1)"
          dockerfile_sha="$(sha256sum "$tmp/ps3-builder.Dockerfile" | cut -d ' ' -f 1)"
          fingerprint="$(printf '%s\n%s\n' "$deps_sha" "$dockerfile_sha" | sha256sum | cut -c1-20)"
          image="ghcr.io/kadorna1/iopenmohaa-ps3-builder:deps-$fingerprint"

          echo "image=$image" >> "$GITHUB_OUTPUT"
          if docker pull "$image"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Reusing prebuilt host dependency image: $image"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No prebuilt image found for this dependency set: $image"
          fi

      - name: Set up Docker Buildx
        if: steps.image.outputs.exists != 'true' && github.event_name != 'pull_request'
        uses: docker/setup-buildx-action@v3

      - name: Build and publish host dependency image
        if: steps.image.outputs.exists != 'true' && github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/docker/ps3-builder.Dockerfile
          push: true
          tags: ${{ steps.image.outputs.image }}

      - name: Require the base dependency image for pull requests
        if: steps.image.outputs.exists != 'true' && github.event_name == 'pull_request'
        shell: bash
        run: |
          echo "::error::The builder image for the PR base dependency set is not available in GHCR. Run a main-branch build to publish it first."
          exit 1

  build-ps3:
    name: Build OpenMoHAA for PS3 (PSL1GHT)
    needs: prepare-builder
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
      packages: read
    container:
      image: ${{ needs.prepare-builder.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Test PS3 aim-assist math and startup config
        shell: bash
        run: |
          set -eu
          cc -std=c99 -Wall -Wextra -Werror tests/test_ps3_aim_assist_math.c -lm -o /tmp/test_ps3_aim_assist_math
          /tmp/test_ps3_aim_assist_math
          cc -std=c99 -Wall -Wextra -Werror tests/test_ps3_stick_math.c -lm -o /tmp/test_ps3_stick_math
          /tmp/test_ps3_stick_math
          grep -Fq 'PS3_NormalizeStick(rx, ry' code/input/ps3_input.c
          grep -Fq 'Cvar_Get("ps3_right_stick_deadzone", "12", CVAR_ARCHIVE)' code/input/ps3_input.c
          config=assets/ps3_usrdir/main/autoexec.cfg
          grep -Fqx 'seta ps3_aim_assist "1"' "$config"
          grep -Fqx 'seta ps3_aim_assist_strength "1.0"' "$config"
          grep -Fq 'CL_PS3ToggleAimAssist' code/client/cl_input.cpp
          grep -Fq 'key == K_JOY6 && down && keys[key].repeats == 1' code/client/cl_keys.cpp
          grep -Fq 'PS3_AIM_ASSIST_TOGGLE' code/client/cl_keys.cpp
          grep -Fq 'UI_UpdateCenterPrint(enabled ? "AIM ASSIST ON" : "AIM ASSIST OFF", 1.0f);' code/client/cl_input.cpp
          grep -Fq 'UI_UpdateCenterPrint( string, 1.0 );' code/client/cl_parse.cpp
          ! grep -Fq 'CG_AimAssistNotify' code/cgame/cg_public.h
          ! grep -Fq 'CG_DrawAimAssistStatus' code/cgame/cg_drawtools.cpp
          grep -Fq 'stage_ps3_title_usrdir.sh' .github/workflows/ps3-build.yml
          grep -Fq -- '--extra-usrdir "$stage_usrdir"' .github/workflows/ps3-build.yml



      - name: Test PS3 multi-title paths and package matrix
        shell: bash
        run: |
          set -eu
          python3 -m unittest discover -s tests -p 'test_ps3_multi_title_config.py' -v

      - name: Test PS3 expansion loading safeguards
        shell: bash
        run: |
          set -eu
          python3 -m unittest discover -s tests -p 'test_ps3_expansion_loading.py' -v

      - name: Test PS3 renderer cache and zone memory diagnostics
        shell: bash
        run: |
          set -eu
          python3 -m unittest discover -s tests -p 'test_ps3_renderer_memory.py' -v

      - name: Test PS3 SMP renderer and material regressions
        shell: bash
        run: |
          set -eu
          python3 -m unittest discover -s tests -p 'test_ps3_renderer_smp.py' -v

      - name: Test PS3 shader cache generator
        shell: bash
        run: |
          set -eu
          python3 -m unittest discover -s tests -p 'test_ps3_shader_cache.py' -v

      # Cache compiler outputs across ephemeral GitHub-hosted runners.
      # The unique SHA key lets each run save an updated cache; restore-keys
      # fall back to the latest cache for this branch, then main.
      - name: Restore PS3 compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ps3-ccache-${{ runner.os }}-${{ env.PS3DEV_ARCHIVE_SHA256 }}-${{ github.head_ref || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ps3-ccache-${{ runner.os }}-${{ env.PS3DEV_ARCHIVE_SHA256 }}-${{ github.head_ref || github.ref_name }}-
            ps3-ccache-${{ runner.os }}-${{ env.PS3DEV_ARCHIVE_SHA256 }}-main-

      - name: Configure ccache
        run: |
          ccache --set-config=compiler_check=content
          ccache --max-size=2G
          ccache --show-stats

      - name: Restore extracted PS3DEV / PSL1GHT toolchain
        id: ps3dev-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ps3dev/${{ env.PS3DEV_ARCHIVE_SHA256 }}
          key: ps3dev-${{ runner.os }}-${{ env.PS3DEV_ARCHIVE_SHA256 }}

      - name: Prepare PS3DEV / PSL1GHT toolchain
        shell: bash
        run: |
          set -euo pipefail
          cache_root="$HOME/.cache/ps3dev/$PS3DEV_ARCHIVE_SHA256"
          sdk_root="$cache_root/sdk"
          mkdir -p "$cache_root"

          if [[ -x "$sdk_root/ppu/bin/ppu-gcc" ]]; then
            echo "Using cached PS3DEV / PSL1GHT toolchain: $sdk_root"
          else
            archive="$RUNNER_TEMP/ps3dev-linux-X64.tar.gz"
            extract_dir="$RUNNER_TEMP/ps3dev-extracted"
            rm -rf "$extract_dir"
            mkdir -p "$extract_dir"

            curl --fail --location --retry 4 --retry-all-errors --connect-timeout 30 \
              "$PS3DEV_ARCHIVE_URL" -o "$archive"
            echo "$PS3DEV_ARCHIVE_SHA256  $archive" | sha256sum --check -
            tar -xzf "$archive" -C "$extract_dir"

            compiler="$(find "$extract_dir" -path '*/ppu/bin/ppu-gcc' -print -quit)"
            if [[ -z "$compiler" ]]; then
              echo "::error::Nightly archive did not contain ppu/bin/ppu-gcc"
              tar -tzf "$archive" | head -n 80 || true
              exit 1
            fi

            extracted_root="${compiler%/ppu/bin/ppu-gcc}"
            [[ -x "$extracted_root/ppu/bin/ppu-g++" ]]
            [[ -x "$extracted_root/ppu/bin/ppu-strip" ]]
            mv "$extracted_root" "$sdk_root"
            rm -rf "$extract_dir"
          fi

          [[ -x "$sdk_root/ppu/bin/ppu-gcc" ]]
          [[ -x "$sdk_root/ppu/bin/ppu-g++" ]]
          [[ -x "$sdk_root/ppu/bin/ppu-strip" ]]
          export PATH="$sdk_root/bin:$sdk_root/host/bin:$sdk_root/ppu/bin:$sdk_root/spu/bin:$PATH"

          for tool in fself sprxlinker; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              candidate="$(find "$sdk_root" -type f -name "$tool" -print -quit)"
              if [[ -z "$candidate" ]]; then
                echo "::error::Required PSL1GHT tool not found: $tool"
                exit 1
              fi
              export PATH="$(dirname "$candidate"):$PATH"
              echo "$(dirname "$candidate")" >> "$GITHUB_PATH"
            fi
          done

          echo "PS3DEV=$sdk_root" >> "$GITHUB_ENV"
          echo "PSL1GHT=$sdk_root" >> "$GITHUB_ENV"
          for dir in "$sdk_root/bin" "$sdk_root/host/bin" "$sdk_root/ppu/bin" \
                     "$sdk_root/spu/bin" "$sdk_root/portlibs/ppu/bin"; do
            if [[ -d "$dir" ]]; then
              echo "$dir" >> "$GITHUB_PATH"
            fi
          done

          {
            echo "SDK archive: $PS3DEV_ARCHIVE_URL"
            echo "SHA-256: $PS3DEV_ARCHIVE_SHA256"
            echo "PS3DEV root: $sdk_root"
            echo "Cache hit: ${{ steps.ps3dev-cache.outputs.cache-hit }}"
            echo
            "$sdk_root/ppu/bin/ppu-gcc" --version
            echo
            for tool in fself sprxlinker; do command -v "$tool"; done
          } | tee ps3-sdk-info.txt

      # Restore the complete Ninja/CMake build tree so unchanged translation
      # units stay built across the ephemeral runner.
      - name: Restore incremental PS3 build tree
        id: ps3-build-cache
        uses: actions/cache@v4
        with:
          path: |
            build-ps3-OMOHAA020
            build-ps3-OMOHAB020
            build-ps3-OMOHAS020
          key: ps3-build-v3-${{ runner.os }}-${{ env.PS3DEV_ARCHIVE_SHA256 }}-${{ github.head_ref || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ps3-build-v3-${{ runner.os }}-${{ env.PS3DEV_ARCHIVE_SHA256 }}-${{ github.head_ref || github.ref_name }}-
            ps3-build-v3-${{ runner.os }}-${{ env.PS3DEV_ARCHIVE_SHA256 }}-

      - name: Restore source hashes and prepare incremental timestamps
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          import subprocess
          import time
          from pathlib import Path

          build_dirs = [
              Path("build-ps3-OMOHAA020"),
              Path("build-ps3-OMOHAB020"),
              Path("build-ps3-OMOHAS020"),
          ]
          build_time = 946684800
          raw_paths = subprocess.run(
              ["git", "ls-files", "--recurse-submodules", "-z"],
              check=True, stdout=subprocess.PIPE
          ).stdout.split(b"\\0")
          current = {}
          for raw in raw_paths:
              if not raw:
                  continue
              name = os.fsdecode(raw)
              path = Path(name)
              if path.is_file() and not path.is_symlink():
                  current[name] = hashlib.sha256(path.read_bytes()).hexdigest()

          changed_union = set()
          for build_dir in build_dirs:
              manifest = build_dir / ".ps3-source-hashes.json"
              if not manifest.is_file():
                  if build_dir.exists():
                      print(f"{build_dir}: missing hash manifest; discarding stale build cache.")
                      shutil.rmtree(build_dir)
                  else:
                      print(f"{build_dir}: no cached build tree; full initial build.")
                  continue
              try:
                  old = json.loads(manifest.read_text(encoding="utf-8"))
                  if not isinstance(old, dict):
                      raise ValueError("manifest root is not an object")
              except (OSError, ValueError):
                  print(f"{build_dir}: invalid hash manifest; discarding stale build cache.")
                  shutil.rmtree(build_dir, ignore_errors=True)
                  continue
              changed = {name for name, digest in current.items() if old.get(name) != digest}
              removed = sorted(set(old) - set(current))
              changed_union.update(changed)
              print(f"{build_dir}: {len(changed)} changed/new, {len(removed)} removed tracked files.")

          # Normalize only once; then stamp the union of changed files for every build tree.
          for name in current:
              os.utime(name, (build_time, build_time), follow_symlinks=False)
          now = time.time()
          for name in sorted(changed_union):
              os.utime(name, (now, now), follow_symlinks=False)
              print(f"  rebuild trigger: {name}")
          print(f"Incremental timestamp pass: {len(changed_union)} changed source files.")
          PY

      - name: Configure three PS3 title variants
        shell: bash
        run: |
          set -euo pipefail
          TITLE_APPIDS=(OMOHAA020 OMOHAB020 OMOHAS020)
          # q_shared.h: TG_MOH=0; TG_MOHTA=1 is Spearhead; TG_MOHTT=2 is Breakthrough.
          TITLE_GAME_IDS=(0 2 1)
          for index in "${!TITLE_APPIDS[@]}"; do
            appid="${TITLE_APPIDS[$index]}"
            target_game="${TITLE_GAME_IDS[$index]}"
            build_dir="build-ps3-$appid"
            echo "==> Configure $appid (com_target_game=$target_game)"
            cmake -S . -B "$build_dir" -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE=cmake/ps3-psl1ght.cmake \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/openmohaa-ps3-install-$appid" \
              -DOPENMOHAA_PS3_APPID="$appid" \
              -DOPENMOHAA_PS3_DATA_APPID="$OPENMOHAA_PS3_DATA_APPID" \
              -DOPENMOHAA_PS3_TARGET_GAME="$target_game" \
              -DOPENMOHAA_PS3_EXPERIMENTAL_SPU_AUDIO="${{ inputs.experimental_spu_audio || startsWith(github.head_ref || github.ref_name, 'experimental/rsxkit-spukit-audio') || startsWith(github.head_ref || github.ref_name, 'experimental/ps3-smp-dxt-spu') }}" \
              -DBUILD_SERVER=OFF \
              -DBUILD_CLIENT=ON \
              -DBUILD_RENDERER_GL2=OFF \
              -DBUILD_GAME_LIBRARIES=OFF \
              -DBUILD_GAME_QVMS=OFF \
              -DUSE_RENDERER_DLOPEN=OFF \
              -DUSE_OPENAL=OFF \
              -DUSE_HTTP=OFF \
              -DUSE_FREETYPE=OFF \
              -DUSE_INTERNAL_LIBS=ON \
              -DUSE_INTERNAL_SDL=OFF \
              2>&1 | tee "ps3-configure-$appid.log"
          done

      - name: Build and link all three PS3 title variants
        shell: bash
        run: |
          set -euo pipefail
          for appid in OMOHAA020 OMOHAB020 OMOHAS020; do
            build_dir="build-ps3-$appid"
            echo "==> Build $appid"
            cmake --build "$build_dir" --parallel 2 2>&1 | tee "ps3-build-$appid.log"
            cmake --build "$build_dir" --target ps3_self --parallel 2 2>&1 | tee "ps3-self-$appid.log"
            test -s "$build_dir/EBOOT.BIN"
            file "$build_dir/EBOOT.BIN"
            if readelf -SW "$build_dir/bin/openmohaa" | grep -Eq "[.]debug_|[.]zdebug_"; then
              echo "::error::$appid release ELF contains debug sections"
              exit 1
            fi
            echo "Verified: $appid release ELF contains no DWARF debug sections"
            ls -lh "$build_dir/EBOOT.BIN"
            find "$build_dir" \( -type f -name '*.elf' -o -type f -name 'openmohaa' \) -print | sort > "ps3-build-outputs-$appid.txt"
            cat "ps3-build-outputs-$appid.txt"
          done

      - name: Report PS3 compiler-cache statistics
        if: always()
        run: ccache --show-stats | tee ps3-ccache-stats.txt

      - name: Stage optional XMB assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/xmb dist
          if [[ -d assets/xmb ]]; then
            find assets/xmb -mindepth 1 -maxdepth 1 ! -name README.md -print
          fi

      - name: Stage title-specific expansion data in each USRDIR
        shell: bash
        run: |
          set -euo pipefail
          for appid in OMOHAA020 OMOHAB020 OMOHAS020; do
            stage_usrdir="$RUNNER_TEMP/ps3-usrdir-$appid"
            rm -rf "$stage_usrdir"
            bash tools/stage_ps3_title_usrdir.sh "$appid" assets/ps3_usrdir "$stage_usrdir"
          done

      - name: Verify staged title-specific shader caches
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import struct
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          expected = {
              "Allied Assault": temp / "ps3-usrdir-OMOHAA020/main/scripts/ps3_shader_cache.bin",
              "Spearhead": temp / "ps3-usrdir-OMOHAS020/mainta/scripts/ps3_shader_cache_mainta.bin",
              "Breakthrough": temp / "ps3-usrdir-OMOHAB020/maintt/scripts/ps3_shader_cache_maintt.bin",
          }

          for title, path in expected.items():
              data = path.read_bytes()
              if len(data) < 32:
                  raise SystemExit(f"{title}: cache header is truncated: {path}")
              magic, version, entries, sources, text_size, source_record, entry_record = struct.unpack_from("<8sIIIIII", data)
              expected_size = 32 + sources * source_record + entries * entry_record + text_size
              if (magic != b"OMHPSHC1" or version != 1 or not entries or not sources
                  or entries > 262144 or sources > 4096 or text_size <= 0
                  or source_record != 64 or entry_record != 76 or expected_size != len(data)):
                  raise SystemExit(f"{title}: invalid cache format or length: {path}")
              print(f"{title}: {entries} definitions, {sources} shader files, {len(data)} bytes")
          PY

      - name: Package three independent PS3 title IDs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          declare -A TITLES=(
            [OMOHAA020]="iOpenMOHAA-PS3 - Allied Assault"
            [OMOHAB020]="iOpenMOHAA-PS3 - Breakthrough"
            [OMOHAS020]="iOpenMOHAA-PS3 - Spearhead"
          )
          for appid in OMOHAA020 OMOHAB020 OMOHAS020; do
            echo "==> Package $appid"
            stage_usrdir="$RUNNER_TEMP/ps3-usrdir-$appid"
            test -d "$stage_usrdir"
            case "$appid" in
              OMOHAB020) expansion_dir="maintt" ;;
              OMOHAS020) expansion_dir="mainta" ;;
              *) expansion_dir="" ;;
            esac
            if [[ -n "$expansion_dir" ]] &&
               ! find "$stage_usrdir/$expansion_dir" -type f -print -quit | grep -q .; then
              echo "::warning::$appid package has no files in USRDIR/$expansion_dir; add them under assets/ps3_usrdir/$expansion_dir to include the expansion content."
            fi
            title="${TITLES[$appid]}"
            bash make_ps3_pkg.sh \
              --build-dir "build-ps3-$appid" \
              --appid "$appid" \
              --out-dir dist \
              --name "iOpenMOHAA-PS3-$appid" \
              --title "$title" \
              --extra-usrdir "$stage_usrdir" \
              2>&1 | tee "ps3-package-$appid.log"
            test -s "dist/iOpenMOHAA-PS3-$appid.pkg"
          done

      - name: Verify all three installable PKGs
        shell: bash
        run: |
          set -euo pipefail
          for appid in OMOHAA020 OMOHAB020 OMOHAS020; do
            pkg="dist/iOpenMOHAA-PS3-$appid.pkg"
            test -s "$pkg" || {
              echo "::error::Missing or empty package: $pkg"
              exit 1
            }
            sha256sum "$pkg"
          done
          printf 'All three PS3 title packages were produced from source revision %s\\n' "$GITHUB_SHA" | tee dist/BUILD-INFO.txt

      - name: Save source hashes for the next incremental build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          raw_paths = subprocess.run(
              ["git", "ls-files", "--recurse-submodules", "-z"],
              check=True, stdout=subprocess.PIPE
          ).stdout.split(b"\\0")
          current = {}
          for raw in raw_paths:
              if not raw:
                  continue
              name = os.fsdecode(raw)
              path = Path(name)
              if path.is_file() and not path.is_symlink():
                  current[name] = hashlib.sha256(path.read_bytes()).hexdigest()

          payload = json.dumps(current, sort_keys=True, separators=(",", ":")) + "\\n"
          for appid in ("OMOHAA020", "OMOHAB020", "OMOHAS020"):
              build_dir = Path(f"build-ps3-{appid}")
              build_dir.mkdir(parents=True, exist_ok=True)
              (build_dir / ".ps3-source-hashes.json").write_text(payload, encoding="utf-8")
              print(f"Saved source hashes for {appid}: {len(current)} files")
          PY

      - name: Upload Allied Assault PKG
        uses: actions/upload-artifact@v4
        with:
          name: iOpenMOHAA-PS3-Allied-Assault-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            dist/iOpenMOHAA-PS3-OMOHAA020.pkg

      - name: Upload Breakthrough PKG
        uses: actions/upload-artifact@v4
        with:
          name: iOpenMOHAA-PS3-Breakthrough-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            dist/iOpenMOHAA-PS3-OMOHAB020.pkg

      - name: Upload Spearhead PKG
        uses: actions/upload-artifact@v4
        with:
          name: iOpenMOHAA-PS3-Spearhead-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            dist/iOpenMOHAA-PS3-OMOHAS020.pkg

      - name: Publish GitHub release v0.2.0.0a
        if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish v0.2.0.0a]')
        uses: actions/github-script@v7
        env:
          RELEASE_NOTES: |
            ## Changes since v0.1.0.0c

            This release contains the 118 commits added to `main` after v0.1.0.0c, including the following feature work and its follow-up fixes/tests.

            - **Training dialogue and scripted audio:** restore `sounddone` callbacks for PCM and streamed sound-effect voices, assign stable callback channels, and make script sound-state queries check the active mixer voice/stream. Failed sound starts report a non-playing channel so dialogue scripts do not wait indefinitely.
            - **Aim-assist controls:** move the physical toggle to edge-triggered R1, show ON/OFF feedback through the normal center-print UI, and remove the separate CGame overlay.
            - **Renderer SMP and frame-state isolation:** add separate front-end/back-end frame storage, double-buffer scene data, snapshot per-view and frame identifiers, isolate view-dependent backend state, and dispatch command batches to the PS3 render worker. `r_smp` defaults to enabled on PS3; failed worker startup retains the synchronous fallback.
            - **Texture and material handling:** add native RSX S3TC DXT1, DXT3 and DXT5 uploads, support the GL1 `GL_BLEND` texture-environment mode, and render additive multitexture stages in two depth-coherent passes. Dynamic-light scratch data is separated by frame.
            - **Omaha Beach profiling and renderer memory:** add FPS/backend timing, direct-XDR versus copied-vertex counters, command/surface-builder, swap and `qglFinish` timings, and game-frame phase timings for events/scripts, actor pre-animation, navigation, bots, entities/AI/physics and post-entity work. The vertex ring is 8 MiB in cacheable IO-mapped main memory (two 4 MiB frame segments), separate from the 4 MiB RSX command buffer. TIKI skeletal skinning caches per-mesh global-to-local bone indices.
            - **DualShock 3 analog response:** use a radial right-stick deadzone and rescale remaining travel while preserving diagonal direction. The archived `ps3_right_stick_deadzone` setting defaults to 12 and is clamped to 0–64; regression tests cover continuity, monotonicity, polarity, diagonals and saturation.
            - **Save-archive streaming and safer replacement:** stream PS3 saves through a 64 KiB staging buffer, preserve random-access backpatches with flush/seek, and write to `.ps3tmp` before flushing, closing and renaming a complete save into place. This removes the former large contiguous archive-buffer allocation while preserving archive ordering/version and reader compatibility. Typed-field mismatch logs include byte offset and object classname where available.
            - **CGame teardown and checkpoint diagnostics:** release retained special-effect command events before resetting the event allocator, and add checkpoint snapshot/emitter-list diagnostics to help investigate remaining state/lifetime faults.
            - **Build and regression coverage:** expand checks for sound callback routing, R1/center-print behavior, SMP frame isolation, blend/additive material paths, right-stick math, archive behavior, multi-title staging and renderer memory. CI builds and links Allied Assault, Breakthrough and Spearhead and verifies standard plus GNPDRM packages for all three.

            The SPUKit streamed-audio mixer is included as an opt-in experimental build path and is not enabled in the standard release configuration. Renderer SMP is PPU-side worker threading, not SPE renderer offload.

            ## Validation

            The release job publishes only after the three-title PS3 build, regression tests, staging checks and six non-empty package outputs have succeeded. Physical-console testing is still required for long-session performance, checkpoint/save/reload behavior and the experimental SPU audio path.
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const { owner, repo } = context.repo;
            const tag = 'v0.2.0.0a';
            const releaseName = 'iOpenMOHAA PS3 v0.2.0.0a';
            const packageDir = path.join(process.env.GITHUB_WORKSPACE || process.cwd(), 'dist');
            const expectedFiles = [
              'iOpenMOHAA-PS3-OMOHAA020.pkg',
              'iOpenMOHAA-PS3-OMOHAA020.gnpdrm.pkg',
              'iOpenMOHAA-PS3-OMOHAB020.pkg',
              'iOpenMOHAA-PS3-OMOHAB020.gnpdrm.pkg',
              'iOpenMOHAA-PS3-OMOHAS020.pkg',
              'iOpenMOHAA-PS3-OMOHAS020.gnpdrm.pkg'
            ];

            const packageFiles = fs.readdirSync(packageDir)
              .filter(name => name.endsWith('.pkg'))
              .sort();
            const missingFiles = expectedFiles.filter(name => !packageFiles.includes(name));
            if (packageFiles.length !== expectedFiles.length || missingFiles.length) {
              throw new Error(
                'Expected exactly six title PKG/GNPDRM files; found ' +
                packageFiles.length + ': ' + packageFiles.join(', ') +
                '. Missing: ' + missingFiles.join(', ')
              );
            }
            for (const name of expectedFiles) {
              const filePath = path.join(packageDir, name);
              if (!fs.statSync(filePath).isFile() || fs.statSync(filePath).size === 0) {
                throw new Error('Missing or empty release package: ' + name);
              }
            }

            let release;
            try {
              const existing = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              release = existing.data;
              if (!release.draft) {
                throw new Error('Release ' + tag + ' is already published; refusing to overwrite it.');
              }
            } catch (error) {
              if (error.status !== 404) throw error;
              const created = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                target_commitish: context.sha,
                name: releaseName,
                body: process.env.RELEASE_NOTES,
                draft: true,
                prerelease: false
              });
              release = created.data;
            }

            // Make retries deterministic: replace any previously uploaded draft assets.
            const oldAssets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner, repo, release_id: release.id, per_page: 100
            });
            for (const asset of oldAssets) {
              await github.rest.repos.deleteReleaseAsset({
                owner, repo, asset_id: asset.id
              });
            }

            for (const name of expectedFiles) {
              const filePath = path.join(packageDir, name);
              const data = fs.readFileSync(filePath);
              await github.rest.repos.uploadReleaseAsset({
                owner,
                repo,
                release_id: release.id,
                name,
                data,
                headers: {
                  'content-type': 'application/octet-stream',
                  'content-length': data.length
                }
              });
              core.info('Uploaded ' + name + ' (' + data.length + ' bytes)');
            }

            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner, repo, release_id: release.id, per_page: 100
            });
            const missingAssets = expectedFiles.filter(name => {
              const expectedSize = fs.statSync(path.join(packageDir, name)).size;
              return !assets.some(asset => asset.name === name &&
                asset.state === 'uploaded' && asset.size === expectedSize);
            });
            if (assets.length !== expectedFiles.length || missingAssets.length) {
              throw new Error(
                'Release asset verification failed. Found ' + assets.length +
                ' assets; missing/invalid: ' + missingAssets.join(', ')
              );
            }

            const published = await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id: release.id,
              name: releaseName,
              body: process.env.RELEASE_NOTES,
              draft: false,
              prerelease: false
            });
            core.notice('Published ' + tag + ' with six verified PS3 packages: ' +
              published.data.html_url);
