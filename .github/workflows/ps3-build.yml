name: PS3 / PSL1GHT Build

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:
    inputs:
      experimental_spu_audio:
        description: "Build the experimental SPU audio mixer (hardware testing required)"
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  PS3DEV_ARCHIVE_URL: https://github.com/ps3dev/ps3dev/releases/download/nightly-2026-10-12/ps3dev-linux-X64.tar.gz
  PS3DEV_ARCHIVE_SHA256: 76b1b3bc9ac260a4ece86da520225da7f2f4e334174e37b850093ff925eeb900
  OPENMOHAA_PS3_APPID: OMOHAA020

jobs:
  build-ps3:
    name: Build OpenMoHAA for PS3 (PSL1GHT)
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fetch canonical XMB assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/xmb
          for asset in PIC1.PNG SND0.AT3; do
            url="https://raw.githubusercontent.com/kadorna1/iopenmohaa-ps3/main/assets/xmb/${asset}"
            curl --fail --location --retry 4 --retry-all-errors --connect-timeout 30 "$url" -o "$RUNNER_TEMP/$asset"
            test -s "$RUNNER_TEMP/$asset"
            install -m 0644 "$RUNNER_TEMP/$asset" "assets/xmb/$asset"
          done

      # Cache downloaded .deb packages. apt indexes are refreshed each run,
      # but already-cached dependency archives do not need to be downloaded again.
      - name: Restore host dependency package cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/apt/archives
          key: ps3-apt-ubuntu-24.04-${{ hashFiles('.github/ps3-host-deps.txt') }}
          restore-keys: |
            ps3-apt-ubuntu-24.04-

      - name: Install host build dependencies
        shell: bash
        run: |
          set -euo pipefail
          apt_cache="$HOME/.cache/apt/archives"
          mkdir -p "$apt_cache/partial"
          sudo apt-get update
          mapfile -t packages < <(sed -e '/^[[:space:]]*#/d' -e '/^[[:space:]]*$/d' .github/ps3-host-deps.txt)
          sudo apt-get -o "Dir::Cache::archives=$apt_cache" install -y --no-install-recommends "${packages[@]}"

      # Cache compiler outputs across ephemeral GitHub-hosted runners.
      # The unique SHA key lets each run save an updated cache; restore-keys
      # fall back to the latest cache for this branch, then main.
      - name: Restore PS3 compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ps3-ccache-${{ runner.os }}-${{ env.PS3DEV_ARCHIVE_SHA256 }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ps3-ccache-${{ runner.os }}-${{ env.PS3DEV_ARCHIVE_SHA256 }}-${{ github.ref_name }}-
            ps3-ccache-${{ runner.os }}-${{ env.PS3DEV_ARCHIVE_SHA256 }}-main-

      - name: Configure ccache
        run: |
          ccache --set-config=compiler_check=content
          ccache --max-size=2G
          ccache --show-stats

      - name: Restore extracted PS3DEV / PSL1GHT toolchain
        id: ps3dev-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ps3dev/${{ env.PS3DEV_ARCHIVE_SHA256 }}
          key: ps3dev-${{ runner.os }}-${{ env.PS3DEV_ARCHIVE_SHA256 }}

      - name: Prepare PS3DEV / PSL1GHT toolchain
        shell: bash
        run: |
          set -euo pipefail
          cache_root="$HOME/.cache/ps3dev/$PS3DEV_ARCHIVE_SHA256"
          sdk_root="$cache_root/sdk"
          mkdir -p "$cache_root"

          if [[ -x "$sdk_root/ppu/bin/ppu-gcc" ]]; then
            echo "Using cached PS3DEV / PSL1GHT toolchain: $sdk_root"
          else
            archive="$RUNNER_TEMP/ps3dev-linux-X64.tar.gz"
            extract_dir="$RUNNER_TEMP/ps3dev-extracted"
            rm -rf "$extract_dir"
            mkdir -p "$extract_dir"

            curl --fail --location --retry 4 --retry-all-errors --connect-timeout 30 \
              "$PS3DEV_ARCHIVE_URL" -o "$archive"
            echo "$PS3DEV_ARCHIVE_SHA256  $archive" | sha256sum --check -
            tar -xzf "$archive" -C "$extract_dir"

            compiler="$(find "$extract_dir" -path '*/ppu/bin/ppu-gcc' -print -quit)"
            if [[ -z "$compiler" ]]; then
              echo "::error::Nightly archive did not contain ppu/bin/ppu-gcc"
              tar -tzf "$archive" | head -n 80 || true
              exit 1
            fi

            extracted_root="${compiler%/ppu/bin/ppu-gcc}"
            [[ -x "$extracted_root/ppu/bin/ppu-g++" ]]
            [[ -x "$extracted_root/ppu/bin/ppu-strip" ]]
            mv "$extracted_root" "$sdk_root"
            rm -rf "$extract_dir"
          fi

          [[ -x "$sdk_root/ppu/bin/ppu-gcc" ]]
          [[ -x "$sdk_root/ppu/bin/ppu-g++" ]]
          [[ -x "$sdk_root/ppu/bin/ppu-strip" ]]
          export PATH="$sdk_root/bin:$sdk_root/host/bin:$sdk_root/ppu/bin:$sdk_root/spu/bin:$PATH"

          for tool in fself sprxlinker; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              candidate="$(find "$sdk_root" -type f -name "$tool" -print -quit)"
              if [[ -z "$candidate" ]]; then
                echo "::error::Required PSL1GHT tool not found: $tool"
                exit 1
              fi
              export PATH="$(dirname "$candidate"):$PATH"
              echo "$(dirname "$candidate")" >> "$GITHUB_PATH"
            fi
          done

          echo "PS3DEV=$sdk_root" >> "$GITHUB_ENV"
          echo "PSL1GHT=$sdk_root" >> "$GITHUB_ENV"
          for dir in "$sdk_root/bin" "$sdk_root/host/bin" "$sdk_root/ppu/bin" \
                     "$sdk_root/spu/bin" "$sdk_root/portlibs/ppu/bin"; do
            if [[ -d "$dir" ]]; then
              echo "$dir" >> "$GITHUB_PATH"
            fi
          done

          {
            echo "SDK archive: $PS3DEV_ARCHIVE_URL"
            echo "SHA-256: $PS3DEV_ARCHIVE_SHA256"
            echo "PS3DEV root: $sdk_root"
            echo "Cache hit: ${{ steps.ps3dev-cache.outputs.cache-hit }}"
            echo
            "$sdk_root/ppu/bin/ppu-gcc" --version
            echo
            for tool in fself sprxlinker; do command -v "$tool"; done
          } | tee ps3-sdk-info.txt

      # Restore the complete Ninja/CMake build tree so unchanged translation
      # units stay built across the ephemeral runner.
      - name: Restore incremental PS3 build tree
        id: ps3-build-cache
        uses: actions/cache@v4
        with:
          path: build-ps3
          key: ps3-build-${{ runner.os }}-${{ env.PS3DEV_ARCHIVE_SHA256 }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ps3-build-${{ runner.os }}-${{ env.PS3DEV_ARCHIVE_SHA256 }}-${{ github.ref_name }}-
            ps3-build-${{ runner.os }}-${{ env.PS3DEV_ARCHIVE_SHA256 }}-

      - name: Mark only changed sources newer than cached objects
        shell: bash
        run: |
          set -euo pipefail
          marker="build-ps3/.ps3-build-cache-commit"
          if [[ ! -s "$marker" ]]; then
            echo "No prior CMake build tree restored; performing initial build."
            exit 0
          fi

          cached_sha="$(cat "$marker")"
          if ! git cat-file -e "${cached_sha}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$cached_sha" || true
          fi
          if ! git cat-file -e "${cached_sha}^{commit}" 2>/dev/null; then
            echo "::warning::Cached build revision is not available; source timestamps left unchanged."
            exit 0
          fi

          changed="$(mktemp)"
          trap 'rm -f "$changed"' EXIT
          git diff --name-only -z "$cached_sha" "$GITHUB_SHA" -- > "$changed"

          # GitHub-hosted checkout gives every source file a fresh mtime. Age
          # unchanged tracked files before Ninja checks dependencies, then make
          # only files changed since the cached build revision newer than objects.
          while IFS= read -r -d '' path; do
            [[ -e "$path" && ! -L "$path" ]] || continue
            touch -d '@946684800' -- "$path"
          done < <(git ls-files -z)

          while IFS= read -r -d '' path; do
            [[ -e "$path" && ! -L "$path" ]] || continue
            touch -- "$path"
          done < "$changed"

          echo "Incremental baseline: $cached_sha"
          echo "Changed tracked paths: $(tr -cd '\0' < "$changed" | wc -c)"

      - name: Configure PS3 cross-build
        shell: bash
        run: |
          set -o pipefail
          cmake -S . -B build-ps3 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=cmake/ps3-psl1ght.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/openmohaa-ps3-install" \
            -DOPENMOHAA_PS3_APPID="$OPENMOHAA_PS3_APPID" \
            -DOPENMOHAA_PS3_EXPERIMENTAL_SPU_AUDIO="${{ inputs.experimental_spu_audio || startsWith(github.head_ref || github.ref_name, 'experimental/rsxkit-spukit-audio') }}" \
            -DBUILD_SERVER=OFF \
            -DBUILD_CLIENT=ON \
            -DBUILD_RENDERER_GL2=OFF \
            -DBUILD_GAME_LIBRARIES=OFF \
            -DBUILD_GAME_QVMS=OFF \
            -DUSE_RENDERER_DLOPEN=OFF \
            -DUSE_OPENAL=OFF \
            -DUSE_HTTP=OFF \
            -DUSE_FREETYPE=OFF \
            -DUSE_INTERNAL_LIBS=ON \
            -DUSE_INTERNAL_SDL=OFF \
            2>&1 | tee ps3-configure.log

      - name: Build PS3 client and static game modules
        shell: bash
        run: |
          set -o pipefail
          cmake --build build-ps3 --parallel 2 2>&1 | tee ps3-build.log

      - name: Report PS3 compiler-cache statistics
        if: always()
        run: ccache --show-stats | tee ps3-ccache-stats.txt

      - name: Link EBOOT.BIN with PSL1GHT
        shell: bash
        run: |
          set -o pipefail
          cmake --build build-ps3 --target ps3_self --parallel 2 2>&1 | tee ps3-self.log
          test -s build-ps3/EBOOT.BIN
          file build-ps3/EBOOT.BIN
          ls -lh build-ps3/EBOOT.BIN
          find build-ps3 \( -type f -name '*.elf' -o -type f -name 'openmohaa' \) -print | sort > ps3-build-outputs.txt
          cat ps3-build-outputs.txt

      - name: Inventory optional XMB assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/xmb dist
          echo "Optional assets found under assets/xmb (all are copied by make_ps3_pkg.sh):"
          find assets/xmb -mindepth 1 -maxdepth 1 ! -name README.md -print || true

      - name: Package installable PKG files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          pkg_args=(
            --build-dir build-ps3
            --out-dir dist
            --name OpenMoHAA-PS3-OMOHAA020
          )
          bash make_ps3_pkg.sh "${pkg_args[@]}" 2>&1 | tee ps3-package.log
          find dist -maxdepth 1 -type f -name '*.pkg' -size +0c -print
          test -n "$(find dist -maxdepth 1 -type f -name '*.pkg' -size +0c -print -quit)"

      - name: Record revision for next incremental build
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_SHA" > build-ps3/.ps3-build-cache-commit

      - name: Upload PS3 build, PKG files, and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpenMoHAA-PS3-OMOHAA020-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
          path: |
            build-ps3/EBOOT.BIN
            build-ps3/bin/openmohaa
            build-ps3/**/*.elf
            dist/*.pkg
            dist/*
            ps3-sdk-info.txt
            ps3-build-outputs.txt
            ps3-configure.log
            ps3-build.log
            ps3-self.log
            ps3-package.log
            ps3-ccache-stats.txt
