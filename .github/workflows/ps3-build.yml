name: PS3 / PSL1GHT Build

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PS3DEV_ARCHIVE_URL: https://github.com/ps3dev/ps3dev/releases/download/nightly-2026-10-12/ps3dev-linux-X64.tar.gz
  PS3DEV_ARCHIVE_SHA256: 76b1b3bc9ac260a4ece86da520225da7f2f4e334174e37b850093ff925eeb900
  OPENMOHAA_PS3_APPID: OMOHAA020

jobs:
  build-ps3:
    name: Build OpenMoHAA for PS3 (PSL1GHT)
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Fetch canonical XMB assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/xmb
          for asset in PIC1.PNG SND0.AT3; do
            url="https://raw.githubusercontent.com/kadorna1/iopenmohaa-ps3/main/assets/xmb/${asset}"
            curl --fail --location --retry 4 --retry-all-errors --connect-timeout 30 "$url" -o "$RUNNER_TEMP/$asset"
            test -s "$RUNNER_TEMP/$asset"
            install -m 0644 "$RUNNER_TEMP/$asset" "assets/xmb/$asset"
          done

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake bison flex build-essential ccache cmake ninja-build \
            ffmpeg file git imagemagick libgtest-dev libsndfile1-dev libelf-dev libgmp-dev libmpfr-dev libmpc-dev \
            libncurses-dev libssl-dev libtool libtool-bin pkg-config \
            python3 python3-pil python3-setuptools subversion texinfo wget \
            zlib1g-dev zip

      # Cache compiler outputs across ephemeral GitHub-hosted runners.
      # The unique SHA key lets each run save an updated cache; restore-keys
      # fall back to the latest cache for this branch, then main.
      - name: Restore PS3 compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ps3-ccache-${{ runner.os }}-${{ env.PS3DEV_ARCHIVE_SHA256 }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ps3-ccache-${{ runner.os }}-${{ env.PS3DEV_ARCHIVE_SHA256 }}-${{ github.ref_name }}-
            ps3-ccache-${{ runner.os }}-${{ env.PS3DEV_ARCHIVE_SHA256 }}-main-

      - name: Configure ccache
        run: |
          ccache --set-config=compiler_check=content
          ccache --max-size=2G
          ccache --show-stats

      - name: Download and verify prebuilt PS3DEV / PSL1GHT nightly
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ps3dev-linux-X64.tar.gz"
          extract_dir="$RUNNER_TEMP/ps3dev-extracted"
          mkdir -p "$extract_dir"

          curl --fail --location --retry 4 --retry-all-errors --connect-timeout 30 \
            "$PS3DEV_ARCHIVE_URL" -o "$archive"
          echo "$PS3DEV_ARCHIVE_SHA256  $archive" | sha256sum --check -
          tar -xzf "$archive" -C "$extract_dir"

          compiler="$(find "$extract_dir" -path '*/ppu/bin/ppu-gcc' -print -quit)"
          if [[ -z "$compiler" ]]; then
            echo "::error::Nightly archive did not contain ppu/bin/ppu-gcc"
            tar -tzf "$archive" | head -n 80 || true
            exit 1
          fi

          sdk_root="${compiler%/ppu/bin/ppu-gcc}"
          [[ -x "$sdk_root/ppu/bin/ppu-gcc" ]]
          [[ -x "$sdk_root/ppu/bin/ppu-g++" ]]
          [[ -x "$sdk_root/ppu/bin/ppu-strip" ]]
          export PATH="$sdk_root/bin:$sdk_root/host/bin:$sdk_root/ppu/bin:$sdk_root/spu/bin:$PATH"

          for tool in fself sprxlinker; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              candidate="$(find "$sdk_root" -type f -name "$tool" -print -quit)"
              if [[ -z "$candidate" ]]; then
                echo "::error::Required PSL1GHT tool not found: $tool"
                exit 1
              fi
              export PATH="$(dirname "$candidate"):$PATH"
              echo "$(dirname "$candidate")" >> "$GITHUB_PATH"
            fi
          done

          echo "PS3DEV=$sdk_root" >> "$GITHUB_ENV"
          echo "PSL1GHT=$sdk_root" >> "$GITHUB_ENV"
          for dir in "$sdk_root/bin" "$sdk_root/host/bin" "$sdk_root/ppu/bin" \
                     "$sdk_root/spu/bin" "$sdk_root/portlibs/ppu/bin"; do
            if [[ -d "$dir" ]]; then
              echo "$dir" >> "$GITHUB_PATH"
            fi
          done

          {
            echo "SDK archive: $PS3DEV_ARCHIVE_URL"
            echo "SHA-256: $PS3DEV_ARCHIVE_SHA256"
            echo "PS3DEV root: $sdk_root"
            echo
            "$sdk_root/ppu/bin/ppu-gcc" --version
            echo
            for tool in fself sprxlinker; do command -v "$tool"; done
          } | tee ps3-sdk-info.txt

      - name: Configure PS3 cross-build
        shell: bash
        run: |
          set -o pipefail
          cmake -S . -B build-ps3 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=cmake/ps3-psl1ght.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/openmohaa-ps3-install" \
            -DOPENMOHAA_PS3_APPID="$OPENMOHAA_PS3_APPID" \
            -DBUILD_SERVER=OFF \
            -DBUILD_CLIENT=ON \
            -DBUILD_RENDERER_GL2=OFF \
            -DBUILD_GAME_LIBRARIES=OFF \
            -DBUILD_GAME_QVMS=OFF \
            -DUSE_RENDERER_DLOPEN=OFF \
            -DUSE_OPENAL=OFF \
            -DUSE_HTTP=OFF \
            -DUSE_FREETYPE=OFF \
            -DUSE_INTERNAL_LIBS=ON \
            -DUSE_INTERNAL_SDL=OFF \
            2>&1 | tee ps3-configure.log

      - name: Build PS3 client and static game modules
        shell: bash
        run: |
          set -o pipefail
          cmake --build build-ps3 --parallel 2 2>&1 | tee ps3-build.log

      - name: Report PS3 compiler-cache statistics
        if: always()
        run: ccache --show-stats | tee ps3-ccache-stats.txt

      - name: Link EBOOT.BIN with PSL1GHT
        shell: bash
        run: |
          set -o pipefail
          cmake --build build-ps3 --target ps3_self --parallel 2 2>&1 | tee ps3-self.log
          test -s build-ps3/EBOOT.BIN
          file build-ps3/EBOOT.BIN
          ls -lh build-ps3/EBOOT.BIN
          find build-ps3 \( -type f -name '*.elf' -o -type f -name 'openmohaa' \) -print | sort > ps3-build-outputs.txt
          cat ps3-build-outputs.txt

      - name: Prepare XMB background and hover sound
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          test -s assets/xmb/PIC1.PNG
          test -s assets/xmb/SND0.AT3

          # Emit the 1920x1080 RGBA background used by the PS3 XMB.
          ffmpeg -y -v error -i assets/xmb/PIC1.PNG -frames:v 1 \
            -vf "scale=1920:1080:flags=lanczos,format=rgba" dist/PIC1.PNG
          test -s dist/PIC1.PNG
          dimensions="$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 dist/PIC1.PNG)"
          if [[ "$dimensions" != "1920x1080" ]]; then
            echo "::error::dist/PIC1.PNG must be 1920x1080, got '$dimensions'"
            exit 1
          fi

          # The committed SND0.AT3 is already PS3-ready. Preserve it exactly;
          # do not re-encode, remux, trim, or impose an arbitrary size cap.
          install -D -m 0644 assets/xmb/SND0.AT3 dist/SND0.AT3
          cmp assets/xmb/SND0.AT3 dist/SND0.AT3
          sha256sum assets/xmb/SND0.AT3 dist/SND0.AT3 | tee dist/SND0-sha256.txt
          test -s dist/SND0.AT3

      - name: Package installable PKG files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          test -s dist/PIC1.PNG
          test -s dist/SND0.AT3
          pkg_args=(
            --build-dir build-ps3
            --out-dir dist
            --name OpenMoHAA-PS3-OMOHAA020
            --pic1 dist/PIC1.PNG
            --snd0 dist/SND0.AT3
          )
          bash make_ps3_pkg.sh "${pkg_args[@]}" 2>&1 | tee ps3-package.log
          find dist -maxdepth 1 -type f -name '*.pkg' -size +0c -print
          test -n "$(find dist -maxdepth 1 -type f -name '*.pkg' -size +0c -print -quit)"

      - name: Upload PS3 build, PKG files, and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpenMoHAA-PS3-OMOHAA020-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
          path: |
            build-ps3/EBOOT.BIN
            build-ps3/bin/openmohaa
            build-ps3/**/*.elf
            dist/*.pkg
            dist/PIC1.PNG
            dist/SND0.AT3
            dist/SND01.AT3
            dist/SND0_01.AT3
            ps3-sdk-info.txt
            ps3-build-outputs.txt
            ps3-configure.log
            ps3-build.log
            ps3-self.log
            ps3-package.log
            ps3-ccache-stats.txt
