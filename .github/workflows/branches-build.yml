name: "Linux Builds"

on:
  push:
    branches:
      - '**'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-linux:
    uses: ./.github/workflows/shared-build.yml
    with:
      environment: 'testing'

  # Create a development release containing Linux builds only.
  create-release:
    if: github.event_name != 'pull_request' && github.ref_name == 'main'
    runs-on: ubuntu-24.04
    environment: 'testing'
    needs: [build-linux]
    steps:
      - name: Release
        uses: softprops/action-gh-release@v2.3.2
        with:
          prerelease: true
          name: '${{ github.ref_name }}-${{ github.sha }}'
          tag_name: 'dev'

  deploy-release:
    if: github.event_name != 'pull_request' && github.ref_name == 'main'
    strategy:
      matrix:
        target_os:
          - linux-amd64
          - linux-i686
          - linux-arm64
          - linux-armhf
          - linux-powerpc
          - linux-ppc64
          - linux-ppc64el
    runs-on: ubuntu-24.04
    environment: 'testing'
    needs: [create-release]
    env:
      RELEASE_NAME: ${{ github.event.repository.name }}-dev-${{ matrix.target_os }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: 'out-${{ matrix.target_os }}'
          path: ${{ github.workspace }}/${{ matrix.target_os }}

      - name: Zip
        working-directory: '${{ github.workspace }}/${{ matrix.target_os }}'
        run: zip -9 -r "../${{ env.RELEASE_NAME }}.zip" ./

      - name: Release
        uses: softprops/action-gh-release@v2.3.2
        with:
          tag_name: 'dev'
          files: ${{ github.workspace }}/${{ env.RELEASE_NAME }}.zip
